name: Avalon-Helper CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 本仓库唯一的发行物是 Avalon 的服务端游戏内核 helper (JDK 17).
# 本地等价命令:
#   ./gradlew :Helper:jar -Dorg.gradle.java.home=/path/to/jdk-17
#   产物: Helper/build/libs/avalon-helper.jar
jobs:
  build_helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build avalon-helper.jar
        run: |
          chmod +x gradlew
          ./gradlew :Helper:jar --console=plain

      - name: Upload avalon-helper.jar
        uses: actions/upload-artifact@v7
        with:
          name: avalon-helper-jar
          path: Helper/build/libs/avalon-helper.jar
